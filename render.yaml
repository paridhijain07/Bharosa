services:
  - type: web
    name: bharosa-stall-assistant
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: PAYPAL_CURRENCY
        value: USD
      - key: CURRENCY_SYMBOL
        value: ₹
      - key: ALERT_SECONDS
        value: 30
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: DEV_MODE
        value: false
      - key: MONGODB_URI
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        value: whatsapp:+14155238886
      - key: PUBLIC_BASE_URL
        sync: false

